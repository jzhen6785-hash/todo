<style>
/* Layout: one narrow pastel column, a sticky tab pill, big day card with three time-of-day cards below. */
:root{
  --bg:#FFF9FC;
  --bg-dot:#FFE9F2;
  --card:#FFFFFF;
  --card-edge:#FFE0EC;
  --ink:#6A4455;
  --muted:#A8869A;
  --pink:#FFB3CF;
  --pink-deep:#E0649A;
  --pink-soft:#FFF0F6;
  --petal:#FFEDE8;
  --butter:#FFF6D6;
  --on-deep:#FFFFFF;
  --shadow:0 8px 22px rgba(240,120,170,.12);
  --font-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.7px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;line-height:1.6;
  padding-inline:16px;padding-block:18px 48px;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
svg.ic{width:1em;height:1em;fill:currentColor;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px;border-radius:10px}

/* hero */
.hero{position:relative;text-align:center;padding:10px 8px 2px}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.2;margin:0;color:var(--pink-deep);text-wrap:balance;letter-spacing:.04em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero .sp{position:absolute;color:var(--pink);opacity:.9}
.hero .sp.a{left:8%;top:10px;font-size:22px;animation:float 4s ease-in-out infinite}
.hero .sp.b{right:10%;top:2px;font-size:16px;color:var(--petal);animation:float 5s ease-in-out infinite .6s}
.hero .sp.c{right:4%;top:46px;font-size:20px;animation:float 4.5s ease-in-out infinite 1.2s}
@keyframes float{50%{transform:translateY(-6px) rotate(8deg)}}

.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{border-radius:20px;padding:10px 8px;text-align:center;border:2px solid var(--card-edge);background:var(--card);box-shadow:var(--shadow)}
.chip:nth-child(1){background:var(--pink-soft)}
.chip:nth-child(2){background:var(--petal)}
.chip:nth-child(3){background:var(--butter)}
.chip b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1;color:var(--pink-deep)}
.chip span{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pink-deep);color:var(--on-deep)}

/* day card */
.daycard{border-radius:28px;background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.daytop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{width:40px;height:40px;border-radius:50%;border:2px solid var(--card-edge);background:var(--pink-soft);display:grid;place-items:center;font-size:18px;color:var(--pink-deep)}
.nav[disabled]{opacity:.35;cursor:default}
.dateblock{flex:1;min-width:150px;text-align:center}
.dateblock .big{font-family:var(--font-display);font-size:40px;line-height:1.1;color:var(--pink-deep)}
.dateblock .wd{display:inline-block;margin-left:6px;font-size:15px;font-weight:700;background:var(--pink-soft);color:var(--pink-deep);border-radius:999px;padding:1px 10px;vertical-align:middle}
.phase{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;margin-top:4px;background:var(--butter);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px}
.badge .ic{color:var(--pink-deep)}
.today-btn{border:2px solid var(--pink-deep);background:transparent;color:var(--pink-deep);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.notice{background:var(--petal);border-radius:16px;padding:8px 12px;font-size:13px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:14px;border-radius:999px;background:var(--pink-soft);overflow:hidden;border:2px solid var(--card-edge)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink-deep));transition:width .35s ease}
.progtxt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.progtxt b{color:var(--pink-deep)}
.party .progtxt b{animation:pop .6s ease}
@keyframes pop{40%{transform:scale(1.25)}}

.slot{border-radius:22px;border:2px dashed var(--card-edge);padding:12px;background:var(--bg)}
.slot.s1{background:var(--pink-soft)}
.slot.s2{background:var(--petal)}
.slot h3{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--pink-deep)}
.slot h3 small{font-family:var(--font-body);font-size:12px;color:var(--muted)}
.slot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task,.event,.note{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:16px;background:var(--card);border:2px solid var(--card-edge)}
.task .txt,.event .txt,.note .txt{min-width:0;overflow-wrap:anywhere}
.check{width:30px;height:30px;border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--pink);font-size:28px}
.check .ic{transition:transform .2s ease}
.check[aria-pressed="true"]{color:var(--pink-deep)}
.check[aria-pressed="true"] .ic{animation:pop .4s ease}
.check .off{display:block}.check .on{display:none}
.check[aria-pressed="true"] .off{display:none}.check[aria-pressed="true"] .on{display:block}
.task.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pink)}
.time{display:inline-block;margin-right:6px;font-size:12px;font-weight:700;background:var(--butter);border-radius:999px;padding:0 8px;line-height:1.7;font-variant-numeric:tabular-nums}
.txt small{color:var(--muted);font-size:12.5px}
.event{background:transparent;border-style:dashed;color:var(--muted)}
.event .mark{display:grid;place-items:center;width:30px;height:24px;color:var(--pink-deep);font-size:20px}
.note{background:transparent;border:0;padding-block:2px;color:var(--muted);font-size:13px}
.note .mark{display:grid;place-items:center;width:30px;color:var(--pink);font-size:14px}
.empty{color:var(--muted);font-size:13px;padding:4px 2px}

/* calendar */
.panel{display:flex;flex-direction:column;gap:16px}
.card{border-radius:26px;background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow);padding:16px}
.card h2{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--pink-deep)}
.card h3{margin:12px 0 4px;font-size:15px}
.card p{margin:4px 0}
.card ul{margin:4px 0;padding-left:20px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.month .h{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cell{position:relative;aspect-ratio:1/1.05;border-radius:14px;border:2px solid transparent;background:transparent;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.cell.on{background:var(--pink-soft);border-color:var(--card-edge);cursor:pointer;font-weight:700}
.cell.off{color:var(--muted);opacity:.45}
.cell.p4{background:var(--petal);opacity:.7}
.cell.sel{border-color:var(--pink-deep)}
.cell.today{box-shadow:0 0 0 3px var(--butter)}
.cell .m{width:78%;height:5px;border-radius:99px;background:var(--card);overflow:hidden}
.cell .m i{display:block;height:100%;background:var(--pink-deep)}
.cell .sp{position:absolute;top:1px;right:2px;font-size:11px;color:var(--pink-deep)}
.cell .full{font-size:10px;color:var(--pink-deep);line-height:1}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.tablewrap{overflow-x:auto;border-radius:16px;border:2px solid var(--card-edge)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--card-edge)}
th{background:var(--pink-soft);color:var(--pink-deep);position:sticky;top:0}
tr.hit td{background:var(--butter);font-weight:700}
.duenow{background:var(--butter);border-radius:16px;padding:8px 12px;font-size:13px;margin:6px 0 10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.hero h1{font-size:28px}.dateblock .big{font-size:34px}.chip b{font-size:24px}}
</style>

}
function decorate(t){
  var m=t.match(/^(\d{1,2}:\d{2}[–-]\d{1,2}:\d{2})\s*(.*)$/), time="", rest=t;
  if(m){time='<span class="time">'+esc(m[1])+'</span>'; rest=m[2];}

}

var LS="pink-planner-ticks-v1";
var ticks={};
try{ticks=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){ticks={}}
var dbDoc=null, saveTimer=null, saving=false, dirty=false;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(ticks))}catch(e){}}
function flush(){
  if(!dbDoc||saving||!dirty) return;
  saving=true; dirty=false;
  dbDoc.set({done:ticks,updated:Date.now()}).catch(function(){}).then(function(){saving=false; if(dirty) flush();});
}
function persist(){
  saveLocal();
  if(!dbDoc) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,600);
}
function initDb(){
  if(!(window.claude&&window.claude.use)) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      if(!id) return null;
      dbDoc=db.doc("data/users/"+id+"/ticks");
      return dbDoc.get().then(function(snap){
        if(snap.exists){
          var rem=(snap.data()||{}).done;
          if(rem&&typeof rem==="object"){ticks=Object.assign({},rem); saveLocal(); renderAll();}
        }else if(Object.keys(ticks).length){ dirty=true; flush(); }
      });
    });
  }).catch(function(){ dbDoc=null; });
}

function monthHtml(m,title){

  for(var k=0;k<lead;k++) h+='<div></div>';
  for(var d=1;d<=days;d++){
    var md=pad(m)+"-"+pad(d), inr=(md in INDEX);
    var cls="cell "+(inr?"on":(md>LAST&&m===12?"p4":"off"));

  return h+'</div></div>';
}

    return '<tr'+(hit?' class="hit"':"")+'><td>'+s[0]+'</td><td>'+fmt(s[1])+'</td>'+tds+'</tr>';
  }).join("");
  byId("p-tips").innerHTML=
  '<div class="card"><h2>单词怎么记</h2>'+
    '<p>做完每套题，在原卷上把不认识的词画出来，旁边写上这个语境下的意思，不用另外抄。之后在第 1、3、7、14 天回看这一套画出来的词，每天 15 分钟。回看时还不认识的词打个星，没有到期套的日子就看带星的词。</p>'+
    '<p>刚开始会觉得痛苦，这是正常的，次数多了就会越来越轻松。</p>'+
    '<div class="duenow">'+esc(fmt(sel))+' 要回看：'+(due.length?esc(due.join("、")):"没有到期的，看带星的词就好")+'（在“今天”里切换日期，这里会跟着变）</div>'+
    '<div class="tablewrap"><table><thead><tr><th>词表</th><th>做题日</th><th>第1次</th><th>第2次</th><th>第3次</th><th>第4次</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="card"><h2>六级小方法</h2><ul>'+
    '<li>阅读：限时 40 分钟，对答案，给错题标原因（词汇、长难句、定位、选项陷阱），生词在原卷上画出来。</li>'+
    '<li>听力：11.8 前每天精听 1 篇，之后周二、周四做整套（连做 35 分钟，订正 40 分钟），其他天复听旧篇 20 分钟。</li>'+
    '<li>写作：每次限时 30 分钟，写完马上对照范文改写，好句型在范文上划出来，直接用进改写。</li>'+
    '<li>翻译：每次限时 30 分钟，对照参考译文，没想到的表达在原稿上标出来，改写时用上。</li>'+
    '<li>每次自评只看三点：句子完整、没有明显语法错、用上了学到的表达。分数以后再看。</li></ul></div>'+
  '<div class="card"><h2>每周的复习日</h2><ul>'+
    '<li>政府会计：周二上午 60 分钟</li><li>计量经济学：周三上午 75 分钟</li><li>成本与管理会计：周五上午 60–75 分钟</li><li>会计信息系统：周六下午 40 分钟</li></ul>'+
    '<p>每天最多复习一科，周日不排课程复习。周二、周四的“网课”是线上家教，周六是线下家教。</p></div>'+
  '<div class="card"><h2>12.13 到 1.11 期末总复习</h2><ul>'+
    '<li>12.13–12.14：休整，列出四科章节清单，标出没学懂的</li>'+
    '<li>12.15–12.29 第一轮：计量 5 天、成本 4 天、会计信息系统 3 天、政府会计 3 天，上午梳理，下午做题，晚上整理错题，计量每天加 30 分钟证明默写</li>'+
    '<li>12.30–12.31：补没完成的项，整理错题本</li>'+
    '<li>1.1–1.7 第二轮：做习题和往年题，背必背内容，每科隔天出现</li>'+
    '<li>1.8–1.11 第三轮：四科都备到随时可考</li></ul>'+
    '<p>1.12 起两周是期末周，任何一天都可能考：每天四科各轮转 30–45 分钟，考前一天只过该科错题本和速记单，考完的科目退出轮转。具体日期出来后再逐日排。</p></div>';
}
function renderAll(){renderChips();renderDay();renderCal();renderTips()}

/* ---------- events ---------- */
function setTab(name){
  ["day","cal","tips"].forEach(function(n){
    byId("p-"+n).hidden = n!==name;
    byId("t-"+n).setAttribute("aria-selected", n===name?"true":"false");
  });
  try{sessionStorage.setItem("pink-tab",name)}catch(e){}
}
["day","cal","tips"].forEach(function(n){byId("t-"+n).addEventListener("click",function(){setTab(n); window.scrollTo(0,0);})});
function go(md){sel=md; renderDay(); renderCal(); renderTips();}
byId("p-day").addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  if(t.id==="prev"){ if(INDEX[sel]>0) go(D[INDEX[sel]-1][0]); }
  else if(t.id==="next"){ if(INDEX[sel]<D.length-1) go(D[INDEX[sel]+1][0]); }
  else if(t.id==="gotoday"){ go(todayMd); }
  else if(t.classList.contains("check")){
    var k=t.getAttribute("data-key");
    if(ticks[k]) delete ticks[k]; else ticks[k]=1;
    persist(); renderDay(); renderCal();
    var again=byId("p-day").querySelector('[data-key="'+k+'"]'); if(again) again.focus();
  }
});
byId("p-cal").addEventListener("click",function(e){
  var t=e.target.closest("button[data-day]"); if(!t) return;
  go(t.getAttribute("data-day")); setTab("day"); window.scrollTo(0,0);
});

renderAll();
initDb();
})();
</script>
